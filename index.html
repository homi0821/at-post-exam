<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="AT採点"><title>AT過去問 採点</title><link rel="manifest" href="manifest.webmanifest"><style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;background:#f4f4f5;color:#171717}header{position:sticky;top:0;z-index:5;background:#111;color:#fff;padding:calc(10px + env(safe-area-inset-top)) 16px 12px;box-shadow:0 2px 8px #0002}.title{font-weight:800;font-size:20px}.sub{font-size:12px;opacity:.7;margin-top:3px}.controls{background:#fff;padding:12px;position:sticky;top:65px;z-index:4;border-bottom:1px solid #ddd}.row{display:flex;gap:8px}.row>*{flex:1}select,button{font:inherit}select{width:100%;padding:11px;border:1px solid #ccc;border-radius:10px;background:#fff}.tabs{display:flex;margin-top:8px;background:#eee;border-radius:10px;padding:3px}.tabs button{flex:1;border:0;background:transparent;padding:9px;border-radius:8px;font-weight:700}.tabs button.on{background:#111;color:#fff}.jump{display:flex;gap:8px;margin-top:8px}.jump input{width:80px;padding:9px;border:1px solid #ccc;border-radius:9px}.jump button{padding:9px 12px;border:1px solid #ccc;background:#fff;border-radius:9px}.progress{height:6px;background:#ddd;margin-top:9px;border-radius:99px;overflow:hidden}.progress i{display:block;height:100%;background:#111;width:0}.wrap{max-width:760px;margin:auto;padding:12px 12px 100px}.q{background:#fff;border-radius:14px;margin:9px 0;padding:12px;box-shadow:0 1px 4px #0000000d;scroll-margin-top:160px}.q.invalid{background:#fffbea;border:1px solid #e7cf55}.qh{display:flex;justify-content:space-between;align-items:center;margin-bottom:9px}.num{font-weight:800}.badge{font-size:11px;background:#ffe94a;padding:3px 7px;border-radius:99px}.choices{display:flex;gap:7px}.choices button{flex:1;border:1px solid #ccc;background:#fff;border-radius:10px;padding:11px 0;font-weight:800}.choices button.sel{background:#111;color:#fff;border-color:#111}.actions{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #ddd;padding:10px max(12px,env(safe-area-inset-left)) calc(10px + env(safe-area-inset-bottom));display:flex;gap:8px;z-index:6}.actions button{flex:1;border:0;border-radius:12px;padding:13px;font-weight:800}.score{background:#111;color:#fff}.secondary{background:#eee}.result{display:none;background:#111;color:#fff;border-radius:16px;padding:18px;margin:12px 0}.result.show{display:block}.big{font-size:34px;font-weight:900}.muted{opacity:.72;font-size:12px}.wrong{margin-top:12px;background:#fff;color:#111;border-radius:12px;padding:12px;max-height:220px;overflow:auto}.wrong span{display:inline-block;margin:3px;background:#f0f0f0;border-radius:7px;padding:5px 7px;font-size:12px}.notice{font-size:11px;color:#666;line-height:1.6;margin:12px 3px}.empty{padding:30px;text-align:center;color:#777}.hidden{display:none!important}@media(min-width:700px){.controls{position:sticky;top:0}.wrap{padding-top:18px}}
</style></head><body><header><div class="title">AT過去問 採点</div><div class="sub">アスレティックトレーナー理論試験</div></header><section class="controls"><div class="row"><select id="year"></select><select id="mode"><option>基礎</option><option>応用</option></select></div><div class="jump"><input id="jump" type="number" min="1" max="110" placeholder="問題番号"><button id="jumpBtn">移動</button><button id="clearBtn">回答を消す</button></div><div class="progress"><i id="prog"></i></div></section><main class="wrap"><div id="result" class="result"></div><div id="questions"></div><div class="notice">※ 正答キーはAT NETWORKの「解答予想」に基づくものです。JSPO公式の正答ではありません。複数回答は選択肢の組み合わせが完全一致した場合に正解とします。黄色の「不適当問題」は採点対象外です。</div></main><div class="actions"><button class="secondary" id="topBtn">先頭へ</button><button class="score" id="scoreBtn">採点する</button></div><script>
let DATA={},key='',ans=[];const letters=['a','b','c','d','e'];
const $=id=>document.getElementById(id);
async function init(){DATA=await (await fetch('data.json')).json(); const years=[...new Set(Object.values(DATA).map(x=>x.year))].sort((a,b)=>a-b);$('year').innerHTML=years.map(y=>`<option value="${y}">令和${y}年度</option>`).join('');$('year').value=years.at(-1); load();}
function getKey(){return `R${$('year').value}-${$('mode').value}`}
function load(){key=getKey(); const d=DATA[key]; if(!d){$('questions').innerHTML='<div class="empty">この年度のデータがありません。</div>';return} ans=JSON.parse(localStorage.getItem('at-ans-'+key)||'null')||Array(110).fill(''); render(); showResult(false);}
function save(){localStorage.setItem('at-ans-'+key,JSON.stringify(ans))}
function render(){const d=DATA[key];$('questions').innerHTML=d.answers.map((correct,i)=>{let n=i+1,sel=ans[i]||'';let invalid=d.invalid.includes(n);return `<section class="q ${invalid?'invalid':''}" id="q${n}"><div class="qh"><span class="num">問${n}</span>${invalid?'<span class="badge">不適当・ノーカン</span>':''}</div><div class="choices">${letters.map(l=>`<button class="${sel.includes(l)?'sel':''}" data-n="${n}" data-l="${l}">${l.toUpperCase()}</button>`).join('')}</div></section>`}).join('');$('questions').querySelectorAll('button').forEach(b=>b.onclick=()=>toggle(+b.dataset.n,b.dataset.l)); updateProgress();}
function toggle(n,l){let i=n-1,s=new Set(ans[i]?ans[i].split(''):[]);s.has(l)?s.delete(l):s.add(l);ans[i]=[...s].sort().join('');save();render();}
function updateProgress(){let done=ans.filter(Boolean).length;$('prog').style.width=(done/110*100)+'%';}
function showResult(show){let r=$('result');if(!show){r.classList.remove('show');r.innerHTML='';return}let d=DATA[key],valid=d.answers.map((_,i)=>i+1).filter(n=>!d.invalid.includes(n));let correct=valid.filter(n=>ans[n-1]===d.answers[n-1]);let wrong=valid.filter(n=>ans[n-1]!==d.answers[n-1]);let unanswered=valid.filter(n=>!ans[n-1]);let pct=valid.length?correct.length/valid.length*100:0;r.innerHTML=`<div class="muted">令和${d.year}年度・${d.mode} ／ 採点対象 ${valid.length}問</div><div class="big">${correct.length} / ${valid.length} 問</div><div>${pct.toFixed(1)}% 正解</div><div class="muted">未回答 ${unanswered.length}問 ・ 不正解 ${wrong.length}問 ・ 不適当 ${d.invalid.length}問</div><div class="wrong"><b>不正解・未回答</b><br>${wrong.concat(unanswered).sort((a,b)=>a-b).map(n=>`<span>問${n}</span>`).join('')||'なし'}</div>`;r.classList.add('show');window.scrollTo({top:0,behavior:'smooth'});}
$('year').onchange=load;$('mode').onchange=load;$('scoreBtn').onclick=()=>showResult(true);$('clearBtn').onclick=()=>{if(confirm('この年度・区分の回答を全部消しますか？')){ans=Array(110).fill('');save();render();showResult(false)}};$('jumpBtn').onclick=()=>{let n=+$('jump').value;if(n>=1&&n<=110)document.getElementById('q'+n)?.scrollIntoView({behavior:'smooth',block:'start'})};$('topBtn').onclick=()=>scrollTo({top:0,behavior:'smooth'});init();
</script></body></html>
